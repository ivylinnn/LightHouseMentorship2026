<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Groups · Lighthouse Mentorship">学员组别 · 领航计划</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   沿用首页 / 导师页视觉系统
   Type: HYXuanSong 35S (display) / HYQiHei 50J·70J (functional)
   ============================================================ */
:root{
  --bg:#08080A;
  --card-bg:rgba(255,255,255,.045); --card-bg-2:rgba(255,255,255,.075);
  --card-border:rgba(255,255,255,.11); --radius:20px;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.18);
  --fg:#F2F2F4; --fg-2:rgba(242,242,244,.66); --fg-3:rgba(242,242,244,.54);
  --violet:#A695E6;
  --display:"HYXuanSong 35S","HYXuanSong","汉仪玄宋","Bodoni Moda","Songti SC",serif;
  --body:"HYQiHei 50J","HYQiHei","汉仪旗黑","Hanken Grotesk","PingFang SC",-apple-system,sans-serif;
  --latin:"Bodoni Moda",serif;
  --gutter:64px; --maxw:1600px; --indent:48px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:30px;
  font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter);position:relative}
section{position:relative;z-index:2}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(58% 42% at 80% 10%,rgba(150,125,225,.13),transparent 70%),
  radial-gradient(52% 40% at 8% 48%,rgba(70,95,190,.09),transparent 70%),
  radial-gradient(55% 45% at 88% 78%,rgba(160,115,205,.10),transparent 70%)}
.grid-lines{position:fixed;inset:0;pointer-events:none;z-index:1}
.grid-lines i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.grid-lines i:nth-child(1){left:calc(max(0px,(100vw - var(--maxw))/2) + 128px)}
.grid-lines i:nth-child(2){right:calc(max(0px,(100vw - var(--maxw))/2) + 224px)}

.card{background:var(--card-bg);-webkit-backdrop-filter:blur(26px) saturate(1.25);
  backdrop-filter:blur(26px) saturate(1.25);border:1px solid var(--card-border);
  border-radius:var(--radius);transition:background .25s,border-color .25s,transform .25s}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--body);
  font-size:13px;line-height:12px;font-weight:700;letter-spacing:1.6px;padding:14px 24px;
  border-radius:999px;background:var(--fg);color:var(--bg);border:1px solid var(--fg);transition:.2s}
.btn:hover{background:transparent;color:var(--fg)}
.btn-ghost{background:rgba(255,255,255,.05);color:var(--fg);border-color:var(--line-strong);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.btn-ghost:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mono{font-size:11px;letter-spacing:1.6px;font-weight:700;color:var(--fg-3);text-transform:uppercase}

/* ---------- header ---------- */
.site-header{position:sticky;top:0;z-index:50;height:76px;transition:background .3s,border-color .3s;
  background:transparent;border-bottom:1px solid transparent}
.site-header.stuck{background:rgba(8,8,10,.72);-webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);border-bottom-color:var(--line)}
.site-header .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:34px;height:34px;flex:none;object-fit:contain}
.brand .name{font-family:var(--display);font-size:21px;letter-spacing:.5px}
.nav{display:flex;align-items:center;gap:34px}
.nav a:not(.btn){font-size:13px;line-height:1;letter-spacing:1.6px;font-weight:500;
  color:var(--fg-2);transition:color .2s}
.nav a:not(.btn):hover,.nav a.on{color:var(--fg)}
.nav .sep{width:1px;height:15px;background:var(--line-strong);flex:none}
.nav a.lang{font-size:13px;letter-spacing:1.6px;font-weight:500;
  padding:6px 12px;border-radius:999px;border:1px solid var(--line-strong);color:var(--fg-2)}
.nav a.lang:hover{color:var(--fg);border-color:var(--fg)}

/* ---------- hero：背景图左右翻转，压暗方式同首页/导师页 ---------- */
.hero{position:relative;min-height:70vh;margin-top:-76px;padding-top:76px;
  display:flex;align-items:center;overflow:hidden;background:#08080A;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:0;
  background:url("web_assets/group-header.webp") center 42% / cover no-repeat;
  transform:scaleX(-1)}   /* 左右翻转：行星弧线改从右侧扫下，光核移到左半 */
.hero .scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:
  linear-gradient(90deg,rgba(7,7,12,.93) 0%,rgba(7,7,12,.76) 28%,rgba(7,7,12,.30) 56%,rgba(7,7,12,.05) 76%,transparent 90%),
  linear-gradient(180deg,rgba(7,7,12,.58),transparent 24%,transparent 58%,rgba(8,8,10,.55) 84%,#08080A 100%)}
.hero .wrap{z-index:3}
.hero h1{font-family:var(--display);font-size:72px;line-height:100px;letter-spacing:-3px;font-weight:400}
.hero .rule{width:84px;height:1px;background:var(--line-strong);margin:26px 0 30px}
.hero .sub{font-size:16px;line-height:30px;color:var(--fg-2);max-width:54ch}

/* ---------- 组别行：全宽图文交替 ---------- */
.g-en{font-size:10px;letter-spacing:2.4px;font-weight:700;color:var(--violet);text-transform:uppercase}
.g-title{font-family:var(--display);font-size:36px;font-weight:400;line-height:1.25}
.g-desc{font-size:14.5px;line-height:26px;color:var(--fg-2)}
.req-list{list-style:none}
.req-list li{font-size:13.5px;line-height:24px;color:var(--fg-2);padding:5px 0 5px 22px;position:relative}
.req-list li::before{content:"";position:absolute;left:0;top:16px;width:9px;height:1px;background:var(--violet)}
.imgph{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--card-border);
  background:radial-gradient(120% 90% at 72% 12%,rgba(160,130,230,.26),transparent 62%),
  linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.imgph .tag{position:absolute;top:12px;left:12px;font-size:9px;letter-spacing:1.2px;font-weight:700;
  color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:2px 9px}
.mm{display:flex;gap:12px;align-items:center;min-width:0}
.mm .av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none}
.mm .nm{font-family:var(--display);font-size:16px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mm .po{font-size:11.5px;line-height:17px;color:var(--fg-3);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.ph{background:rgba(255,255,255,.055);border:1px solid var(--card-border);position:relative}
.av.ph::before{content:"";position:absolute;left:50%;top:22%;width:30%;aspect-ratio:1;
  transform:translateX(-50%);border-radius:50%;background:rgba(255,255,255,.16)}
.av.ph::after{content:"";position:absolute;left:50%;top:60%;width:62%;height:56%;
  transform:translateX(-50%);border-radius:52% 52% 0 0;background:rgba(255,255,255,.14)}
.is-ph .nm,.is-ph .po{color:var(--fg-3)}
.g-more{font-size:11px;letter-spacing:1.6px;font-weight:700;color:var(--fg-3);transition:color .2s}
.g-more:hover{color:var(--fg)}

.rows{display:flex;flex-direction:column;gap:18px}
/* 图位宽 340 固定，高度撑满整行（与文字+导师区齐平）；
   真图进来后 object-fit:cover 等比放大裁切，不变形 */
.row{position:relative;display:grid;grid-template-columns:340px 1fr;gap:48px;padding:36px;
  scroll-margin-top:110px}
.row .media{align-self:stretch}
.row .media .imgph{height:100%}
.row .media .imgph img{width:100%;height:100%;object-fit:cover;object-position:center 55%}
.row:nth-child(even){grid-template-columns:1fr 340px}
.row:nth-child(even) .media{order:2}
.row .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px}
.row .mm-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px;
  padding-top:22px;border-top:1px solid var(--line)}

/* ---------- 报名 CTA（同首页 final-cta） ---------- */
.final-cta{padding:150px 0;position:relative;overflow:hidden;margin-top:140px}
.final-cta::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 90% at 76% 40%,rgba(160,125,225,.22),transparent 68%)}
.final-cta h2{font-family:var(--display);font-size:60px;line-height:1.3;font-weight:400;letter-spacing:-2px}
.final-cta .sub{color:var(--fg-2);margin:24px 0 0;font-size:16px;max-width:52ch}
.final-cta .actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:44px}

/* ---------- footer ---------- */
.site-footer{border-top:1px solid var(--line);padding:44px 0;margin-top:0;position:relative;z-index:2;
  display:flex;justify-content:space-between;align-items:center;gap:30px;
  font-size:12.5px;color:var(--fg-3);flex-wrap:wrap}
.site-footer nav{display:flex;gap:28px}

@media(max-width:1240px){
  :root{--gutter:32px;--indent:32px}
  .grid-lines{display:none}
  .row{grid-template-columns:1fr;gap:28px}
  .row:nth-child(even) .media{order:0}
  .row .media .imgph{aspect-ratio:16/9;height:auto}
}

/* ---------- 移动端下拉菜单(桌面端隐藏) ---------- */
.menu-btn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line-strong);
  background:none;cursor:pointer;position:relative;flex:none;padding:0}
.menu-btn span{position:absolute;left:10px;right:10px;height:1.5px;background:var(--fg);
  transition:transform .25s,opacity .25s}
.menu-btn span:nth-child(1){top:13px}
.menu-btn span:nth-child(2){top:18px}
.menu-btn span:nth-child(3){top:23px}
.menu-btn.open span:nth-child(1){transform:translateY(5px) rotate(45deg)}
.menu-btn.open span:nth-child(2){opacity:0}
.menu-btn.open span:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
.m-menu{position:fixed;top:84px;right:16px;z-index:60;min-width:224px;display:none;
  flex-direction:column;padding:10px;border-radius:16px;
  background:rgba(16,16,22,.92);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border:1px solid var(--line-strong);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.m-menu.open{display:flex}
.m-menu a{padding:13px 16px;font-size:14px;line-height:1;letter-spacing:1.2px;color:var(--fg-2);border-radius:10px}
.m-menu a:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.m-menu a.apply{margin-top:6px;background:var(--fg);color:var(--bg);text-align:center;font-weight:700}

@media(max-width:700px){
  .nav a:not(.btn):not(.lang),.nav .sep{display:none}
  .nav .btn{display:none}
  .menu-btn{display:block}
  .hero h1{font-size:38px;line-height:60px;letter-spacing:-1.5px}
  .g-title{font-size:28px}
  .sv .sv-q{align-items:flex-start;flex-direction:column;gap:12px}
  .sv .sv-q .lab{min-width:0}
  .row{padding:24px}
  .row .cols,.row .mm-row{grid-template-columns:1fr}
  .final-cta h2{font-size:34px;letter-spacing:-1px}
}
</style>
</head>

<script>
/* =========================================================================
   数据 —— 组别文案来自公众号《美西十二期报名开启》；导师沿用现有素材
   ========================================================================= */
/* ---------- i18n：中/英切换。静态文案写在 data-en 属性里；JS 渲染的数据带 *_en 字段 ---------- */
let LANG = (()=>{ try{ return localStorage.getItem("lh-lang") || "zh"; }catch(e){ return "zh"; } })();
const t = (zh,en)=> LANG==="en" && en!=null ? en : zh;
function applyStatic(){
  document.querySelectorAll("[data-en]").forEach(el=>{
    if(!el.hasAttribute("data-zh")) el.setAttribute("data-zh", el.innerHTML);
    el.innerHTML = LANG==="en" ? el.getAttribute("data-en") : el.getAttribute("data-zh");
  });
  document.documentElement.lang = LANG==="en" ? "en" : "zh-CN";
  document.querySelectorAll("[data-lang-btn]").forEach(b=>b.textContent = LANG==="en" ? "中文" : "EN");
}
function setLang(l){ LANG=l; try{ localStorage.setItem("lh-lang", l); }catch(e){} applyStatic(); render(); }
document.querySelectorAll("[data-lang-btn]").forEach(b=>b.addEventListener("click", e=>{ e.preventDefault(); setLang(LANG==="en"?"zh":"en"); }));

const GROUPS = [
  { id:"rising", img:"web_assets/groups/group-rising.webp", cn:"新星职业组", en:"Rising", name_en:"Rising Professionals",
    desc:"面向中大型科技公司工作经验相对较少、但展现出快速成长潜力的职场新锐。",
    desc_en:"For early-career professionals at mid-sized to large technology companies who demonstrate strong potential for rapid growth.",
    reqs:["通常为全职工作五年以内","对职业发展有主动思考","具备较强学习能力和成长潜力"],
    reqs_en:["Typically Five or Fewer Years of Full-Time Experience","Proactive About Career Development","Strong Learning Agility and Growth Potential"],
    goal:"通过导师经验分享和同行交流，帮助学员理解不同的职业发展路径，拓展行业视野，建立对自身优势与未来方向的认知，加速从优秀个人贡献者向未来领导者成长。",
    goal_en:"Through mentors’ experience sharing and candid peer exchange, mentees explore different career paths, broaden their understanding of the industry, and develop a clearer sense of their strengths and future direction—accelerating their growth from outstanding individual contributors into emerging leaders." },
  { id:"senior", img:"web_assets/groups/group-senior.webp", cn:"资深职业组", en:"Senior", name_en:"Senior Professionals",
    desc:"面向中大型科技公司拥有较丰富经验的 Manager、Senior Manager 及对应级别的 Individual Contributor。",
    desc_en:"For experienced managers, senior managers, and individual contributors at equivalent levels within mid-sized to large technology companies.",
    reqs:["具备较丰富的职场经验","有领导团队、推动重要项目或跨团队协作经验","希望进一步扩大个人影响力"],
    reqs_en:["Significant Professional Experience","Experience Leading Teams, Driving Critical Projects, or Collaborating Across Functions","Seeking to Expand Their Influence"],
    goal:"匹配具有丰富管理经验和高阶领导力的导师，帮助学员从更高视角理解组织、业务和领导力，在职业发展的关键阶段获得新的启发，共同定义 AI 时代的领导力边界与组织架构。",
    goal_en:"Guided by mentors with extensive management and executive experience, mentees learn to understand organizations, businesses, and leadership from a broader perspective. At a pivotal stage in their careers, they gain fresh insight and explore the evolving possibilities of leadership and organizational design in the AI era." },
  { id:"startup", img:"web_assets/groups/group-startup.webp", cn:"初创员工组", en:"Startup", name_en:"Startup Employees",
    desc:"面向初创公司的优秀员工与业务骨干，Manager 或 Individual Contributor 均可，职能不限。",
    desc_en:"For high-performing employees and key contributors across all functions at startups.",
    reqs:["公司规模约 20–500 人","通常处于 C 轮及之前阶段","公司的业务骨干"],
    reqs_en:["Approximately 20–500 Employees","Typically Series C or Earlier","A Key Contributor to the Business"],
    goal:"导师通常具有 Founder、VP 或创业公司核心团队经验，围绕创业公司的真实挑战展开交流——如何在快速变化的环境中推动业务、扩大个人影响力、与公司共同成长、面对创业阶段的关键选择。",
    goal_en:"Mentors typically bring experience as founders, VPs, or core startup team members. Conversations focus on the realities of startup life: driving the business through rapid change, expanding personal impact, growing alongside the company, and navigating the pivotal decisions that shape a startup career." },
  { id:"founder", img:"web_assets/groups/group-founder.webp", cn:"创始人组", en:"Founder", name_en:"Founders",
    desc:"面向全职创业的科技公司创始人，以接近 Private Board Meeting 的小班形式交流。",
    desc_en:"For full-time technology founders, with intimate, board-style sessions designed for candid discussion and peer guidance.",
    reqs:["全职投入创业","公司已经完成融资","优先考虑融资 $2M 以上（轮次不限）"],
    reqs_en:["Working on the Startup Full Time","Company Has Completed a Funding Round","Priority Given to Companies That Have Raised $2M or More, at Any Stage"],
    goal:"导师通常为成功创业者或投资人，帮助创始人面对公司战略选择、团队建设与组织发展、融资和董事会管理等创业过程中的关键挑战。让创业之路少一份孤独，多一份支持。",
    goal_en:"Mentors are typically accomplished founders or investors who help participants navigate the defining challenges of company building, including strategic decision-making, team and organizational development, fundraising, and board management—making the founder journey less isolating and better supported." }
];
const P = "web_assets/mentors/airtable/";
/* 每组展示 3 位代表导师:按「美西十二期导师出炉」公众号文章里的导师排序取前三。
   名单和照片都来自 mentors-data.js(Airtable 同步),这里只决定顺序。
   没出现在 PRIORITY 里的导师排在最后,按 Airtable 视图原顺序。 */
const PRIORITY = [
  "贾扬清", "翁捷", "Yuankai Ge", "Frank Ren 任中方", "David Feng 冯大为", "Sean Sheng",
  "Liangxiao Zhu", "钱骏", "James Chen 陈璟", "Xiangru Chen", "张梁", "张佳音", "Chang Chen",
  "Yvonne Luo", "David Wei", "卜峥", "田爱博", "周云凯", "Ling Leng", "Belinda Zeng 曾函",
  "Brett Chen", "Nancy Lu 吕佳", "Richard Liu 刘向群", "Wen Shi", "刘昆", "包胜华", "Maggie Du 杜莘",
  "Alex Chen 陈伟", "Leo Ma 马骉", "Lily Zhang 张若若", "廖璘", "许振斌", "Fei Guo", "Claire Fang",
  "陈培基", "John Hu 胡荣湘", "申恺", "Ethan Zhu 朱一丰", "James Wu 吳正邦", "张翼", "Jenny Jau",
  "Yiyao Liu", "Michael Jin 金学成", "李峻", "邵旭辉", "Charlie Wen 文华峰", "刘长明", "王金林", "陈维国",
  "John Sun 孙壮", "Bill Zhang", "朱阳波"
];
const RANK = new Map(PRIORITY.map((n, i) => [n, i]));
const ALL = typeof MENTORS !== "undefined" ? MENTORS : [];

function topThree(gid){
  return ALL
    .map((m, i) => ({ m, i }))                       // i 保留 Airtable 原顺序做次级排序
    .filter(x => x.m.region === "west" && x.m.group === gid)
    .sort((a, b) => (RANK.has(a.m.name) ? RANK.get(a.m.name) : 1e9) -
                    (RANK.has(b.m.name) ? RANK.get(b.m.name) : 1e9) || a.i - b.i)
    .slice(0, 3).map(x => x.m);                      // 该组暂时没有导师就返回空数组
}
const GROUP_MENTORS = Object.fromEntries(GROUPS.map(g => [g.id, topThree(g.id)]));

const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avatar = m => (m.ph || !m.photo)
  ? `<div class="av ph"></div>`
  : `<div class="av"><img src="${P}${encodeURIComponent(m.photo)}" alt="${esc(m.name)}" loading="lazy" decoding="async"></div>`;
const TBD = ()=>t("职位待补","Title Coming Soon");
const mm = m => `<div class="mm ${m.ph?'is-ph':''}">${avatar(m)}
  <div style="min-width:0"><div class="nm">${m.ph?t('导师姓名','Mentor Name'):esc(t(m.name, m.name_en || m.name))}</div>
  <div class="po">${m.ph||!m.position?TBD():esc(m.position)}</div></div></div>`;

function render(){
document.getElementById("rows").innerHTML = GROUPS.map(g=>`
  <div class="card row" id="g-${g.id}">
    <div class="media"><div class="imgph"><img src="${g.img}" alt="${t(g.cn,g.name_en)}" loading="lazy" decoding="async"></div></div>
    <div>
      <div class="g-en">${t(g.en,g.cn)}</div>
      <h3 class="g-title" style="margin-top:8px">${t(g.cn,g.name_en)}</h3>
      <p class="g-desc" style="margin-top:14px">${t(g.desc,g.desc_en)}</p>
      <div class="cols">
        <div><div class="mono" style="margin-bottom:10px">${t("招生要求","Eligibility")}</div>
          <ul class="req-list">${t(g.reqs,g.reqs_en).map(r=>`<li>${r}</li>`).join("")}</ul></div>
        <div><div class="mono" style="margin-bottom:10px">${t("你会得到什么","What You'll Gain")}</div>
          <p style="font-size:13.5px;line-height:24px;color:var(--fg-2)">${t(g.goal,g.goal_en)}</p></div>
      </div>
      ${GROUP_MENTORS[g.id].length ? `
      <div class="mm-row" style="margin-top:26px">${GROUP_MENTORS[g.id].map(mm).join("")}</div>
      <div style="margin-top:18px"><a class="g-more" href="mentors.html">${t("查看本组全部导师","Meet All Mentors in This Group")} →</a></div>` : ""}
    </div>
  </div>`).join("");
}
applyStatic(); render();

/* header 滚动后变实 */
const hdr = document.getElementById("hdr");
const onScroll = ()=>hdr.classList.toggle("stuck", scrollY>40);
onScroll(); addEventListener("scroll", onScroll, {passive:true});

/* ---------- 移动端下拉菜单 ---------- */
const menuBtn = document.getElementById("menuBtn"), mMenu = document.getElementById("mMenu");
if(menuBtn && mMenu){
  menuBtn.addEventListener("click", e=>{
    e.stopPropagation();
    const open = mMenu.classList.toggle("open");
    menuBtn.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", open);
  });
  document.addEventListener("click", e=>{
    if(menuBtn.contains(e.target)) return;
    if(!mMenu.contains(e.target) || e.target.closest("a")){
      mMenu.classList.remove("open"); menuBtn.classList.remove("open");
      menuBtn.setAttribute("aria-expanded","false");
    }
  });
}
</script>
</body>
</html>
